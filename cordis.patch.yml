# dsh-agents bundle patch：往 profile 的插件花名册里插一行宿主插件。
# 三个工具（agent_roles / agent_taskbook / agent_spawn）由 lib/index.js 注册；
# 插件没有浏览器半边（无 WebUI），所以不需要 dsh.client 清单。
#
# 安装：dsh plugin --profile <name> add <path-or-git-url>
# （bundle patch 会自动应用；不要在 profile patch 里重复插这一行——重复 id 会让 loader 崩）
- insert:
    - id: dsh-agents
      name: dsh-agents
      config:
        # ── 档位路由表（角色复杂度 → provider + model）──────────────────────
        # 三档语义：LOW=检索/文档类窄任务，MEDIUM=实现/调试/测试类主力，
        # HIGH=需求分析/规划/架构/评审类长链条推理。别名 haiku/sonnet/opus 同义。
        # 默认值按本机 settings.yaml 的已配置 provider 选定；改档只改这里，不必改代码。
        tiers:
          LOW:
            provider: deepseek
            model: deepseek-flash
          MEDIUM:
            provider: glm-pro
            model: glm-5.3-flash
          HIGH:
            provider: deepseek
            model: deepseek-v4-pro
        # ── 按角色覆盖档位（可选）───────────────────────────────────────────
        # 例：让 executor 也用高档模型（角色 id 见 agent_roles 的 list）：
        # roleOverrides:
        #   executor:
        #     provider: deepseek
        #     model: deepseek-v4-pro
        # ── 角色会话的 Agent 预设 ──────────────────────────────────────────
        # 不填 = 走 DSH 默认预设（settings.yaml 的 agent-presets.default，当前 standard）。
        # defaultPreset: standard
        # ── minimal 派活的 Agent 预设（R3-B1 S1；personaMode='minimal' 时解析 agentPreset）──
        # 缺省 'minimal'（宿主内置预设，跨机可用、不绑本机自建预设名）；自建预设
        # 显式指向一次生效。非法/不存在的 preset id 在 spawn 时报错并列可用清单
        # （复用宿主校验）。配套策略文件落 <advisorDataDir>/sessions/<b64>.toolscope.json。
        minimalPreset: minimal
        # ── agent_reply 唤醒频控常数（R3-B1 S5 小收口③；V3-2 落点裁决=config 键位）──
        # 唤醒类投递滑动窗口频控：窗口内超过上限自动降级 inject（消息不丢、唤醒不发）；
        # 连续降级达熔断阈值 → 熔断该会话唤醒通道至会话结束。三个键都可选、非法值
        # 启动即抛错（fail-loud）；roster 表不承载这组常数（它是运行时行为参数，
        # 不是角色→工具的策略数据名单）。
        # replyWakeWindowMs: 60000   # 滑动窗口毫秒
        # replyWakeWindowMax: 3      # 窗口内唤醒类请求上限
        # replyWakeBreakAfter: 10    # 连续降级熔断阈值
        # ── 任务书澄清模式缺省值 ───────────────────────────────────────────
        # interactive=缺参数按 subagent-clarify 协议问组织者；
        # autonomous=禁提问，按缺省决策表取值（适合无人值守批量派活）。
        clarifyMode: interactive
        # 未显式给 evidencePath 时，产出落到 <cwd>/<agentOutSubdir>/<角色id>-<时间戳>.md
        agentOutSubdir: agent-out
        # 紧急刹车：false = 禁用 agent_spawn（agent_roles/agent_taskbook 仍可用）
        allowSpawn: true
        # ── advisor（内置顾问；契约 docs/advisor-contract.md）────────────────
        # 默认关：与 memory-evolve 的 advisor 语义重叠，两套不同时开。
        # ⚠️ 下面三个键（advisorEnabled/advisorProvider/advisorModel）：
        #    **deprecated / compatibility-only / does not affect runtime behavior**。
        #    advisor 的启用与评审模型已彻底**会话级**，这三个键只被解析（保 boot
        #    兼容）与一次性告警，**不参与任何生效判定**——键本身不可删：删掉
        #    ALLOWED_KEYS 成员会让老配置触发「未知 advisor 配置键」而整个插件
        #    boot 失败。开启某会话走端点：PATCH {sessionId, enabled:true, provider, model}。
        advisorEnabled: false
        # 模型**完全手动指定、无任何兜底**：已取消 HIGH 档回落（不再读上面的
        # tiers 段），也不继承会话模型。评审模型只来自该会话自己的 PATCH；
        # GET 响应的 modelSource 只有 'session'（本会话已指定）| 'unset'（未指定）两态。
        advisorProvider: null
        advisorModel: null
        # 数据目录（默认 ~/.dsh/plugins-data/dsh-agents/advisor）：
        # records.jsonl（记录，全局单文件，GET 按会话过滤返回）+
        # sessions/<base64url(sessionId)>.json（**PATCH 的落盘位置**，会话级配置）+
        # sessions/<b64>.seen.json（幂等去重；独立成文件，不与配置争同一 inode）。
        advisorDataDir: null
        # 右侧面板显示开关（与评审运行解耦）
        advisorPanelEnabled: true
        # 送入评审的有界窗口（0 = 无上限）
        advisorMaxMessages: 60
        # 评审队列上限（满 = 丢最新）
        advisorMaxQueued: 32
        # 单次评审调用超时（ms）
        advisorCallTimeoutMs: 90000
        # steer 冷却：投递后 N 个主回合内降级 inject
        advisorImmuneTurns: 2
        # 走 steer（实时打断指导）的等级
        advisorSteerSeverities: [nit, concern, blocker]
        # info 级是否也注入（默认只记录不打扰）
        advisorInfoInject: false
        # 覆盖内置评审提示词（≤8KB，空 = 内置）
        advisorSystemPrompt: ''
        # 记录保留条数上限
        advisorPersistLimit: 200
        # 单轮「相关文件 · 符号精读」（Repository Context 的 L2 层）最多精读几个源文件
        # （0 = 关闭 L2 精读，只保留 L1 文件树/Git/搜索）。S2 新增，四处同步见契约 §1。
        advisorContextMaxFiles: 4
        # agentic 工具循环的往返上限（每次评审内模型最多发起几轮只读工具调用；
        # 0 = 关闭工具循环，退回单次调用）。S3 新增，四处同步见契约 §1（条文留 S5）。
        advisorMaxToolRounds: 4
